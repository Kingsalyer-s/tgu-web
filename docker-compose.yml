services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: heritage-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:-please-change-this-in-env-file}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/data       # 持久化 data.db + uploads + logs
    expose:
      - "3001"
    networks:
      - heritage-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: heritage-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - heritage-net

  backup:
    image: alpine:3.20
    container_name: heritage-backup
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "apk add --no-cache sqlite tzdata && cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime &&
             echo '0 3 * * * /bin/sh /backup.sh >> /backups/backup.log 2>&1' > /etc/crontabs/root &&
             crond -f -l 8"
    networks:
      - heritage-net

networks:
  heritage-net:
    driver: bridge
